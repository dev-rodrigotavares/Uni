<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <title>Ficha4</title>
  <script src="https://cdn.jsdelivr.net/npm/x_ite@latest/dist/x_ite.min.js"></script>
  <style>
    body {
      margin: 0;
      background: white;
    }
  </style>
</head>

<body>

  <x3d-canvas style="width: 100vw; height: 100vh;">
    <X3D profile="Full" version="4.0">
      <Scene>

        <Shape>
          <Appearance>
            <Material diffuseColor="1 1 1" specularColor="1 1 1" shininess="0.3">
              <ImageTexture containerField="diffuseTexture" url='"pedra_color.jpg"' />
              <ImageTexture containerField="specularTexture" url='"pedra_spec.jpg"' />
              <ImageTexture containerField="normalTexture" url='"pedra_normal.jpg"' />
            </Material>
          </Appearance>

          <IndexedFaceSet solid="false" coordIndex="0 1 4 -1  1 2 4 -1  2 3 4 -1  3 0 4 -1  3 2 1 0 -1"
            texCoordIndex="0 1 2 -1  0 1 2 -1  0 1 2 -1  0 1 2 -1  3 4 5 6 -1">
            <Coordinate point="-1 0 1   1 0 1   1 0 -1   -1 0 -1   0 1.5 0" />
            <TextureCoordinate point="0 0  1 0  0.5 1   0 0  1 0  1 1  0 1" />
          </IndexedFaceSet>
        </Shape>

      </Scene>
    </X3D>
  </x3d-canvas>

</body>

</html>
