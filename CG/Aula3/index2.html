
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercicio 1</title>
</head>

<body onload="main()">

    <h2>Canvas 2D</h2>

    <canvas id="canvas" width="320" height="200"></canvas>

    <h2>SVG</h2>

    <svg width="320" height="200">

        <defs>
            <pattern id="textura"
                width = "320" height = "200"
                patternUnits="userSpaceOnUse">

                <image href="monstros.jpg"
                x="0" y="0"
                width="320" height="200"
                preserveAspectRatio="xMidYMid slice"/>
            </pattern>
        </defs>

        <rect x="1" y="1"
              width="318" height="198"
              rx="24"
              fill="url(#textura)"
              stroke="red"
              stroke-width="2"/>

    </svg>

    <script src="script2.js"></script>

</body>
</html>
